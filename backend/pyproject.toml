[project]
name = "osint-memory"
version = "0.1.0"
description = "Persistent OSINT intelligence and knowledge-graph platform (backend)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "psycopg[binary]>=3.1",
  "pyjwt>=2.8",
  "httpx>=0.27",
  "ddgs>=9.0",  # UNOFFICIAL keyless web-search fallback (scrapes DuckDuckGo; ToS-gray) - see ADR-0010
  "lxml>=5.0",  # HTML text extraction for analyst-selected page fetches
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]
